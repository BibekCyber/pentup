root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/pentagi ./cmd/pentagi"
  bin = "./tmp/pentagi"
  include_ext = ["go", "graphqls", "sql", "tmpl", "yml", "yaml"]
  exclude_dir = ["tmp", "vendor", "docs", "migrations/sql"]
  exclude_regex = ["_test\\.go"]
  delay = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = "2s"

[log]
  time = true

[misc]
  clean_on_exit = true
