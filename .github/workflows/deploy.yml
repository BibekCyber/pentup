name: Build and Auto-Deploy

on:
  push:
    branches: [main]

env:
  IMAGE: local/pentagi:${{ github.sha }}

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build the Code into a Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}

      - name: Pack the Image into a File
        run: docker save "${{ env.IMAGE }}" | gzip > pentagi-image.tar.gz

      - name: Copy the Image to the Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: pentagi-image.tar.gz
          target: /opt/pentagi/deploy

      - name: Update the Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /opt/pentagi
            gunzip -c deploy/pentagi-image.tar.gz | docker load
            rm -f deploy/pentagi-image.tar.gz

            # Tell the server to use this exact new version
            if grep -q '^PENTAGI_IMAGE=' .env; then
              sed -i "s|^PENTAGI_IMAGE=.*|PENTAGI_IMAGE=${{ env.IMAGE }}|" .env
            else
              echo "PENTAGI_IMAGE=${{ env.IMAGE }}" >> .env
            fi

            # Restart ONLY the app (this runs the database migrations automatically).
            # The database and scraper images are never re-pulled here, so an
            # upstream "latest" change can never break the database.
            docker compose up -d pentagi

            # Remove old app versions only (keeps Kali, scraper and database images)
            docker images --format '{{.Repository}}:{{.Tag}}' \
              | grep -E '^(local/pentagi|registry\.digitalocean\.com/.+/pentagi):' \
              | grep -v ':${{ github.sha }}$' \
              | xargs -r docker rmi || true
            docker image prune -f
